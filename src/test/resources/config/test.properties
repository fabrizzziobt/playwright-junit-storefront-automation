# Browser runtime defaults
browser=chromium
headless=false
default.timeout.ms=15000

# Bot Protecttion 
user.agentstring=
header.token=

# Default locale if not supplied at runtime
default.locale=en_US

# Locale-to-domain mappings
domain.en_US=https://yoursite.com
#domain.en_CA=https://yourstorefront.ca
#domain.en_GB=https://yoursite.co.uk

# Locale-to-product-file mappings
product.data.file.en_US=data/products-en_US.json
product.data.file.en_CA=data/products-en_CA.json
product.data.file.en_GB=data/products-en_GB.json

# Optional Playwright browser locale mapping
browser.locale.en_US=en-US
browser.locale.en_CA=en-CA
browser.locale.en_GB=en-GB
